name: Deploy

# Manual dispatch with environment selector. Each environment gates via
# GitHub Environments → required reviewers. Rollback is a re-dispatch with
# a previous tag.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        required: true
        options: [staging, production]
      image_tag:
        description: 'Image tag to deploy (e.g. v1.2.3 or commit sha)'
        type: string
        required: true
      run_migrations:
        description: 'Apply pending migrations before cutover'
        type: boolean
        required: true
        default: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  # S52 — id-token allows cosign verify to cross-check the signed
  # image against Sigstore's transparency log.
  id-token: write

jobs:
  # S52 — verify the cosign signature before we touch migrations or
  # EasyPanel. An unsigned image (or one whose signature does not
  # match the expected workflow identity) aborts the deploy — nothing
  # downstream runs.
  verify:
    name: Verify image signature
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Verify API image signature
        id: verify
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Keyless verification: the image must carry a Sigstore
          # signature issued by the GitHub Actions workflow that
          # produced it. We pin the expected workflow ref so a
          # compromised fork of release.yml cannot produce a
          # signature that passes this gate.
          EXPECTED_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${IMAGE_TAG}"
          cosign verify \
            --certificate-identity-regexp "^${EXPECTED_IDENTITY}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/${{ github.repository }}/torque-api:${IMAGE_TAG}
          cosign verify \
            --certificate-identity-regexp "^${EXPECTED_IDENTITY}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/${{ github.repository }}/torque-web:${IMAGE_TAG}
          echo "verified=true" >> "$GITHUB_OUTPUT"

  migrate:
    name: Run migrations (${{ inputs.environment }})
    if: inputs.run_migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # S52 — block migrations until cosign verify passes.
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/

      - name: Dry-run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          migrate -path ./torque-api/migrations -database "${DATABASE_URL}" version || true
          migrate -path ./torque-api/migrations -database "${DATABASE_URL}" up

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # S52 — verify must pass; migrate must succeed or be skipped.
    needs: [verify, migrate]
    if: always() && needs.verify.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via EasyPanel webhook
        env:
          EASYPANEL_HOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "${EASYPANEL_HOOK}" ]; then
            echo "EASYPANEL_DEPLOY_WEBHOOK secret not set — cannot deploy"
            exit 1
          fi
          curl -fsSL -X POST "${EASYPANEL_HOOK}" \
            -H 'Content-Type: application/json' \
            -d "{\"tag\":\"${IMAGE_TAG}\",\"env\":\"${{ inputs.environment }}\"}"

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Healthz probe
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          if [ -z "${BASE_URL}" ]; then
            echo "BASE_URL var not set for this environment — skipping smoke test"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if curl -fsSL "${BASE_URL}/healthz" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed: ${BASE_URL}/healthz did not return 200 after 5 attempts"
          exit 1
