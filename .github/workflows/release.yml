name: Release

# Triggered by a `v*` tag on main. Builds distroless Docker images for both
# surfaces, pushes to GHCR, and emits a draft GitHub release. Deploy is
# separate (deploy.yml) and intentionally gated by an environment review.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Build + push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API
        uses: docker/build-push-action@v6
        with:
          context: ./torque-api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/torque-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/torque-api:latest
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=torque-api
          cache-to: type=gha,scope=torque-api,mode=max

      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: ./torque-web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/torque-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/torque-web:latest
          cache-from: type=gha,scope=torque-web
          cache-to: type=gha,scope=torque-web,mode=max

  release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
