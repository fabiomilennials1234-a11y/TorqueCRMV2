name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torque-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: torque-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Test (with coverage thresholds)
        # `--coverage` activates vitest.config.ts thresholds (45/45/40/40
        # baseline from S31). Failing thresholds fail the job.
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: torque-web-dist-${{ github.sha }}
          path: torque-web/dist
          retention-days: 7

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torque-api

    # Postgres service so integration tests can hit a real DB. The DATABASE_URL
    # env is exposed to every step; tests gated by its presence will run.
    services:
      postgres:
        # pgvector/pgvector:pg15 estende postgres:15 com extension `vector`
        # exigida pela migration 0019 (S39 Copilot RAG). Sem isso, `migrate up`
        # falha em `CREATE EXTENSION vector` e bloqueia toda a suite backend.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: torque
          POSTGRES_PASSWORD: torque
          POSTGRES_DB: torque
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://torque:torque@localhost:5432/torque?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track Go version directly from go.mod so dep bumps that push
          # the toolchain higher (Dependabot rebases) dont break CI.
          go-version-file: torque-api/go.mod
          cache-dependency-path: torque-api/go.sum

      # go.sum nao esta committed (oversight pre-S52). Regenerar em runtime
      # com `go mod tidy` antes de qualquer ferramenta que verifique deps.
      # Quando go.sum for commitado em sprint futura, este step vira no-op.
      - name: go mod tidy (regen go.sum)
        run: go mod tidy

      - name: go mod download
        run: go mod download

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/

      - name: Run migrations
        run: migrate -path ./migrations -database "${DATABASE_URL}" up

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test -race -timeout 5m ./...

  lint-go:
    name: golangci-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torque-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Track Go version directly from go.mod so dep bumps that push
          # the toolchain higher (Dependabot rebases) dont break CI.
          go-version-file: torque-api/go.mod
          cache-dependency-path: torque-api/go.sum

      # go.sum nao esta committed (oversight pre-S52). Regenerar em runtime
      # com `go mod tidy` antes do golangci-lint typecheck.
      - name: go mod tidy (regen go.sum)
        run: go mod tidy

      # Pre-download deps explicitly. golangci-lint-action invoca o linter
      # com module mode, mas em runners frescos sem cache os pacotes
      # transitivos (pgx, chi, yaml, etc.) só aparecem depois de
      # `go mod download`. Sem isso o typecheck reporta "undefined: pgx"
      # falso-positivos em qualquer file que importa libs externas.
      - name: go mod download
        run: go mod download

      - uses: golangci/golangci-lint-action@v7
        with:
          # v2.1.0 builds com Go 1.24/1.25 support — necessario apos
          # Dependabot rebases auto-bumparem toolchain em go.mod. v1.61
          # build com Go 1.23 recusava 'targeted Go version 1.25.0'.
          # action@v7 requerido pra carregar golangci-lint v2.x.
          version: v2.1.0
          working-directory: torque-api
          args: --timeout=5m

      # gosec now runs on every CI pass, not just the nightly scan. The
      # high-severity gate keeps the main branch free of known-bad
      # patterns; lower-severity findings are tracked in security-scan.yml.
      - name: gosec (high severity gate)
        uses: securego/gosec@master
        with:
          args: '-severity=high -confidence=medium ./...'
