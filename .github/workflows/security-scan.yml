name: Security Scan

# Periodic dependency + container scans. Runs nightly + on every PR to
# main. Findings are reported to the Actions summary and fail the run on
# HIGH/CRITICAL.

on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    name: gosec (Go SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # S67 — pin gosec to released tag (supply chain). Bump em lockstep com ci.yml.
      - uses: securego/gosec@v2.22.0
        with:
          args: '-severity=medium -confidence=medium -exclude-dir=tests ./torque-api/...'

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          # S67 — track go.mod toolchain (era 1.22 hardcoded; falsava-clean
          # quando go.mod estava em 1.25).
          go-version-file: torque-api/go.mod
          cache-dependency-path: torque-api/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: torque-api
        run: govulncheck ./...

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torque-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: torque-web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --production

  trivy-image:
    name: Trivy container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image locally
        run: docker build -t torque-api:scan ./torque-api
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: torque-api:scan
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
