openapi: 3.1.0
info:
  title: Torque API
  version: 0.52.0
  description: |
    Torque CRM backend. Conventions (ADR-001): wire uses snake_case; frontend
    transforms to camelCase. Session is carried in httpOnly cookies; never
    ship a Bearer token.

    **S52 refresh.** Covers endpoint families shipped through S51 —
    leads, pipes, confirmations, meetings, tasks, inbox, templates,
    campaigns, workflows, agents (+ playground/metrics/knowledge/TTS),
    billing, quotas, integrations (Google/TinyERP/Meta/SZChat), public
    webhooks (billing + lead), analytics, performance, master. Shapes
    are intentionally compact — the wire details live in the respective
    handler files; this spec is the map, not the manual.
  contact:
    name: Torque engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.torque.app
    description: Production

tags:
  - name: probes
    description: Orchestrator health and readiness checks.
  - name: public
    description: Unauthenticated surface.
  - name: auth
    description: Session lifecycle (login, refresh, logout, me).
  - name: me
    description: Authenticated-user-scoped endpoints.
  - name: operations
    description: Async jobs (ADR-006; 202 Accepted + poll + WS push).
  - name: leads
    description: F01 lead CRUD + cursor pagination (ADR-004).
  - name: pipes
    description: F01 kanban pipes, stages, entries, moves.
  - name: confirmations
    description: F02 confirmation flow (meetings, no-show).
  - name: meetings
    description: F13 agenda + optional GCal sync (S49).
  - name: tasks
    description: Follow-up tasks (F05).
  - name: inbox
    description: F04 inbox (conversations, messages, takeover).
  - name: templates
    description: Message templates for the inbox composer.
  - name: campaigns
    description: F08 campaigns (dispatch, recipients, lifecycle).
  - name: workflows
    description: F07 workflow builder + executions.
  - name: agents
    description: F06 Copilot agents + playground + knowledge + TTS + triggers.
  - name: billing
    description: F14 subscriptions, checkout, cancel, webhook.
  - name: quotas
    description: S51 quota observability + master adjustments.
  - name: integrations
    description: External providers (Google Calendar, TinyERP, Meta Ads, SZ.Chat).
  - name: webhooks
    description: Public webhook endpoints (billing + lead ingestion).
  - name: analytics
    description: Funnel + attribution + leads analytics.
  - name: performance
    description: F09 rankings, goals, commissions, awards.
  - name: products
    description: F11 product catalog for proposals.
  - name: members
    description: F10 team members + role + permissions.
  - name: proposals
    description: F03 proposals (money flow).
  - name: settings
    description: Org + member settings surfaces.
  - name: onboarding
    description: F13 onboarding wizard.
  - name: master
    description: Cross-org master admin (impersonation, system health).

paths:
  /healthz:
    get:
      tags: [probes]
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /readyz:
    get:
      tags: [probes]
      summary: Readiness probe (DB pool ping)
      responses:
        "200": { description: Ready to serve traffic }
        "503": { description: Not ready }

  /api/bootstrap:
    get:
      tags: [public]
      summary: Runtime configuration for the browser
      responses:
        "200":
          description: Public runtime config (safe for anonymous clients)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }

  /openapi.yaml:
    get:
      tags: [public]
      summary: This specification (YAML)
      responses:
        "200": { description: spec source }

  /openapi.json:
    get:
      tags: [public]
      summary: This specification (JSON)
      responses:
        "200": { description: spec re-serialized as JSON }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session established (cookies set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "403": { description: No active organization membership }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token
      responses:
        "200": { description: New cookies issued }
        "401": { description: Refresh cookie missing, revoked, expired, or reused }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session and clear cookies
      responses:
        "204": { description: No Content }

  /api/v1/auth/me:
    get:
      tags: [auth, me]
      summary: Current user bundle
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: User + organization + permissions + csrf_token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/preferences:
    patch:
      tags: [me]
      summary: Update per-user preferences (ADR-007 ui_mode)
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CSRFHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ui_mode: { type: string, enum: [manager, salesperson] }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: CSRF mismatch }

  /api/v1/operations:
    post:
      tags: [operations]
      summary: Submit an async job (202 Accepted pattern, ADR-006)
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CSRFHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationSubmit" }
      responses:
        "202":
          description: Accepted; poll Location and/or subscribe to WS
          headers:
            Location:
              schema: { type: string }
              description: URL to poll
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }

  /api/v1/operations/{id}:
    get:
      tags: [operations]
      summary: Poll operation status
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "404": { description: Not found (or out of tenant scope) }
    delete:
      tags: [operations]
      summary: Cancel an in-flight operation
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/CSRFHeader" }
      responses:
        "204": { description: Cancelled }
        "409": { description: Already terminal or missing }

  /api/v1/ws:
    get:
      tags: [operations]
      summary: WebSocket upgrade (tenant-scoped broadcast)
      description: |
        Authenticated via the session cookie. On upgrade the server registers
        the connection under the session's organization_id. Every broadcast is
        tenant-isolated by the hub.

        Event envelope: `{ type, tenant_id, entity_type, entity_id, version, patch, occurred_at }`.
      security: [{ cookieAuth: [] }]
      responses:
        "101": { description: Switching Protocols }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # ---------- Leads (F01) -------------------------------------------
  /api/v1/leads:
    get:
      tags: [leads]
      operationId: listLeads
      summary: List leads (cursor-paginated)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: responsible_id, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Cursor-paginated envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [leads]
      operationId: createLead
      summary: Create a lead (quota-enforced — S51)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadCreateRequest" }
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/leads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [leads]
      operationId: getLead
      summary: Fetch a lead
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
          description: OK
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [leads]
      operationId: updateLead
      summary: Partial update of a lead
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadPatchRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
          description: OK
    delete:
      tags: [leads]
      operationId: softDeleteLead
      summary: Soft-delete a lead (decrements quota usage)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Pipes (F01) -------------------------------------------
  /api/v1/pipes:
    get:
      tags: [pipes]
      operationId: listPipes
      summary: List pipes
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/pipes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [pipes]
      operationId: getPipe
      summary: Pipe detail
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/pipes/{id}/stages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [pipes]
      operationId: listPipeStages
      summary: Stages of a pipe (ordered by position)
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/pipes/{id}/entries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [pipes]
      operationId: listPipeEntries
      summary: Active entries for a pipe
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [pipes]
      operationId: createPipeEntry
      summary: Add a lead into a pipe stage
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "201": { description: Entry created }

  /api/v1/pipes/{id}/entries/{entryId}/move:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [pipes]
      operationId: movePipeEntry
      summary: Move entry to a different stage (atomic Serializable tx)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Moved }
        "409":
          description: Stage mismatch (stage does not belong to pipe)

  # ---------- Confirmations (F02) -----------------------------------
  /api/v1/confirmations/{entryId}:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [confirmations]
      operationId: getConfirmation
      summary: Fetch confirmation for a pipe entry
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [confirmations]
      operationId: upsertConfirmation
      summary: Upsert meeting metadata for a confirmation entry
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200": { description: Upserted }

  /api/v1/confirmations/{entryId}/confirm:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [confirmations]
      operationId: markConfirmed
      summary: Mark confirmed (S50 — best-effort GCal event creation)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Confirmed }

  /api/v1/confirmations/{entryId}/no-show:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [confirmations]
      operationId: markNoShow
      summary: Mark no-show with reason
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Marked no-show }

  /api/v1/confirmations/overdue:
    get:
      tags: [confirmations]
      operationId: listOverdueConfirmations
      summary: Unconfirmed meetings past due
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }

  # ---------- Meetings (F13) ----------------------------------------
  /api/v1/meetings:
    get:
      tags: [meetings]
      operationId: listMeetings
      summary: List meetings in a window (default [-7d, +30d])
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to,   in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK }
    post:
      tags: [meetings]
      operationId: createMeeting
      summary: Create meeting (optionally pushed to Google Calendar — S49)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "201": { description: Created }

  /api/v1/meetings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [meetings]
      operationId: getMeeting
      summary: Meeting detail
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    delete:
      tags: [meetings]
      operationId: deleteMeeting
      summary: Delete meeting (mirrors GCal cancel if linked)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Deleted }

  /api/v1/meetings/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [meetings]
      operationId: setMeetingStatus
      summary: Transition status (scheduled|completed|cancelled|no_show)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Updated }

  # ---------- Tasks (F05) -------------------------------------------
  /api/v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create task
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "201": { description: Created }

  /api/v1/tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Update task
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200": { description: Updated }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete task
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Deleted }

  # ---------- Inbox (F04) -------------------------------------------
  /api/v1/conversations:
    get:
      tags: [inbox]
      operationId: listConversations
      summary: List conversations
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/conversations/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [inbox]
      operationId: listMessages
      summary: Messages in a conversation (infinite scroll)
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [inbox]
      operationId: sendMessage
      summary: Send a message (via Evolution / SZ.Chat adapter)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "201": { description: Accepted }

  /api/v1/conversations/{id}/takeover:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [inbox]
      operationId: takeoverConversation
      summary: Human takeover (suspends the Copilot)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Taken over }

  /api/v1/conversations/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [inbox]
      operationId: resolveConversation
      summary: Mark conversation resolved
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Resolved }

  # ---------- Templates --------------------------------------------
  /api/v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List message templates
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Create template (admin)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "201": { description: Created }

  # ---------- Campaigns (F08) ---------------------------------------
  /api/v1/campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: List campaigns
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: Create campaign (admin)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "201": { description: Created }

  /api/v1/campaigns/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: Campaign detail
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    patch:
      tags: [campaigns]
      operationId: updateCampaign
      summary: Update campaign
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200": { description: Updated }

  /api/v1/campaigns/{id}/launch:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [campaigns]
      operationId: launchCampaign
      summary: Launch / pause / resume / cancel
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Status changed }

  # ---------- Workflows (F07) ---------------------------------------
  /api/v1/workflows:
    get:
      tags: [workflows]
      operationId: listWorkflows
      summary: List workflows
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [workflows]
      operationId: createWorkflow
      summary: Create workflow draft
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "201": { description: Created }

  /api/v1/workflows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [workflows]
      operationId: getWorkflow
      summary: Workflow detail (with steps)
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    patch:
      tags: [workflows]
      operationId: updateWorkflow
      summary: Update workflow metadata
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200": { description: Updated }

  /api/v1/workflows/{id}/steps:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [workflows]
      operationId: createWorkflowStep
      summary: Add a step to a workflow
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "201": { description: Created }

  /api/v1/workflows/{id}/steps/{stepId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [workflows]
      operationId: updateWorkflowStep
      summary: Replace step config
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200": { description: Updated }
    delete:
      tags: [workflows]
      operationId: deleteWorkflowStep
      summary: Remove step
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Deleted }

  /api/v1/workflows/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [workflows]
      operationId: enqueueWorkflowRun
      summary: Enqueue a debug run
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "202": { description: Enqueued }

  /api/v1/runs/{id}/steps:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [workflows]
      operationId: listRunSteps
      summary: Trace timeline for a run (refetch 2s while pending|running)
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }

  # ---------- Agents / Copilot (F06) --------------------------------
  /api/v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List Copilot agents
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [agents]
      operationId: createAgent
      summary: Create agent (admin)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "201": { description: Created }

  /api/v1/agents/{id}:
