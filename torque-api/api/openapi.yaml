      responses:
        "200": { description: Impersonated session issued }
        "500": { description: AUDIT_FAILED — impersonation refused atomically }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __torque_session

  parameters:
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: Must echo the __torque_csrf cookie (double-submit).

  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: Email or password is incorrect
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidBody:
      description: Request body could not be parsed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (or outside tenant scope)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QuotaExceeded:
      description: 402 — tenant at cap for the resource (S51)
      headers:
        X-Quota-Resource:
          schema: { type: string }
        X-Quota-Limit:
          schema: { type: integer }
        X-Quota-Usage:
          schema: { type: integer }
        X-Quota-Remaining:
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, enum: [QUOTA_EXCEEDED] }
                  message: { type: string }
                  details:
                    type: object
                    properties:
                      resource: { type: string }
                      limit: { type: integer }
                      current_usage: { type: integer }
                      remaining: { type: integer }

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    Bootstrap:
      type: object
      properties:
        app_version: { type: string }
        env: { type: string, enum: [dev, staging, prod] }
        ws_url: { type: string, format: uri }
        sentry_dsn: { type: string, description: "Public client-side DSN" }
        feature_flags:
          type: object
          additionalProperties: { type: boolean }
        server_time: { type: string, format: date-time }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        organization_slug: { type: string, nullable: true }

    LoginResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }

    Me:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        csrf_token: { type: string }
        is_master: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [admin, membro] }
        ui_mode: { type: string, enum: [manager, salesperson] }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        plan_id: { type: string, nullable: true }
        payment_status: { type: string }
        logo_url: { type: string, nullable: true }

    Permission:
      type: object
      properties:
        key: { type: string }
        allowed: { type: boolean }
        source: { type: string }

    OperationSubmit:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        input:
          description: Arbitrary JSON passed to the worker.
        retry_remaining: { type: integer, minimum: 0 }

    Operation:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        progress: { type: number, minimum: 0, maximum: 1, nullable: true }
        result: { description: "Present on success." }
        error: { description: "Present on failure." }
        retry_remaining: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }

    # ---------- Leads -----------------------------------------------
    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        company: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        position: { type: string, nullable: true }
        responsible_id: { type: string, format: uuid, nullable: true }
        rating: { type: integer, minimum: 0, maximum: 5, nullable: true }
        qualification_score: { type: integer, nullable: true }
        segment: { type: string, nullable: true }
        origin: { type: string, nullable: true }
        custom_fields: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LeadPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Lead" }
        meta:
          type: object
          properties:
            next_cursor: { type: string, description: "Empty when last page" }

    LeadCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        company: { type: string, nullable: true }
        phone: { type: string, nullable: true, description: "phone OR email required" }
        email: { type: string, format: email, nullable: true }
        position: { type: string, nullable: true }
        responsible_id: { type: string, format: uuid, nullable: true }
        origin: { type: string, nullable: true }
        custom_fields: { type: object, additionalProperties: true }

    LeadPatchRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        company: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        position: { type: string, nullable: true }
        responsible_id: { type: string, format: uuid, nullable: true }
        rating: { type: integer, nullable: true }
        segment: { type: string, nullable: true }

    # ---------- Billing / Subscription ------------------------------
    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        plan_id: { type: string }
        status: { type: string, enum: [pending, active, past_due, cancelled, expired] }
        provider: { type: string, enum: [mock, asaas] }
        amount_cents: { type: integer }
        currency: { type: string, example: BRL }
        pix_qr_code: { type: string, nullable: true }
        pix_qr_code_image: { type: string, nullable: true, description: "data:image/png;base64,..." }
        pix_expires_at: { type: string, format: date-time, nullable: true }
        current_period_end: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CheckoutRequest:
      type: object
      required: [plan_id, amount_cents]
      properties:
        plan_id: { type: string }
        amount_cents: { type: integer, minimum: 1 }
        currency: { type: string, default: BRL }

    # ---------- Quotas (S51) ----------------------------------------
    Quota:
      type: object
      properties:
        resource: { type: string, example: leads }
        plan_base: { type: integer, minimum: 0 }
        purchased_addons: { type: integer, minimum: 0 }
        admin_adjustment: { type: integer, description: "Can be negative" }
        current_usage: { type: integer, minimum: 0 }
        effective_limit: { type: integer, description: "max(0, base + addons + adjustment)" }
        remaining: { type: integer, description: "max(0, effective_limit - current_usage)" }

    # ---------- Integrations (S49/S50) ------------------------------
    IntegrationCredential:
      type: object
      properties:
        provider: { type: string, enum: [google, tinyerp, meta, szchat] }
        connected: { type: boolean }
        external_account_id: { type: string, nullable: true }
        scopes:
          type: array
          items: { type: string }
          nullable: true
        expires_at: { type: string, format: date-time, nullable: true }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error_text: { type: string, nullable: true }
        last_error_at: { type: string, format: date-time, nullable: true }

    MetaAdAccountInsights:
      type: object
      properties:
        account_id: { type: string }
        date_range: { type: string }
        currency: { type: string, nullable: true }
        spend_cents: { type: integer }
        impressions: { type: integer }
        clicks: { type: integer }
        leads: { type: integer }
        cpl_cents: { type: integer, description: "-1 when leads=0" }
        campaigns:
          type: array
          items:
            type: object
            properties:
              campaign_id: { type: string }
              name: { type: string }
              spend_cents: { type: integer }
              impressions: { type: integer }
              clicks: { type: integer }
              leads: { type: integer }
        fetched_at: { type: string, format: date-time }

    # ---------- Lead webhook (S50) ----------------------------------
    LeadWebhookPayload:
      type: object
      required: [external_id, name]
      properties:
        external_id: { type: string, description: "Provider-unique dedup key" }
        source: { type: string, enum: [webhook, meta, szchat, manual, n8n] }
        name: { type: string }
        company: { type: string, nullable: true }
        phone: { type: string, nullable: true, description: "phone OR email required" }
        email: { type: string, format: email, nullable: true }
        position: { type: string, nullable: true }
        origin: { type: string, nullable: true }
        custom_fields: { type: object, additionalProperties: true }
