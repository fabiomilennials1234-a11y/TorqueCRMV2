  /webhooks/lead:
    post:
      tags: [webhooks]
      operationId: leadWebhook
      summary: Public lead ingestion (HMAC-SHA256 signature — S50)
      description: |
        Signed via `X-Torque-Lead-Signature: sha256=<hex>` over the raw body.
        Tenant is routed via the `X-Torque-Tenant: <uuid>` header. Dedup is
        `(organization_id, external_id)` UNIQUE; duplicate retries return 200.
      responses:
        "201": { description: Lead created; workflow trigger lead_created fired }
        "200": { description: Duplicate external_id — idempotent }
        "400": { description: Malformed body or missing external_id }
        "401": { description: HMAC signature mismatch }
        "413": { description: Body exceeded 64 KiB cap }
        "503": { description: Webhook disabled (secret not configured) }

