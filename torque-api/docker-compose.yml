# docker-compose.yml — local development.
#
# Brings up Postgres 15 and the API with hot rebuild. Migrations are run by an
# ephemeral container that waits for Postgres, applies them, then exits.
#
# Usage:
#   docker compose up            # build images if needed, run everything
#   docker compose up db         # just the database (useful when running `make run` on host)
#   docker compose down -v       # stop + wipe volumes (destroys dev data)

services:
  db:
    image: postgres:15-alpine
    container_name: torque-db
    environment:
      POSTGRES_USER: torque
      POSTGRES_PASSWORD: torque
      POSTGRES_DB: torque
      # Defensive: fail fast instead of trusting auth-socket defaults.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - torque_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torque -d torque"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.1
    container_name: torque-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://torque:torque@db:5432/torque?sslmode=disable"
      - "up"
    restart: "no"

  api:
    build:
      context: .
      args:
        VERSION: dev
    container_name: torque-api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENV: dev
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://torque:torque@db:5432/torque?sslmode=disable"
      LOG_LEVEL: debug
      CORS_ORIGINS: "http://localhost:5173"
    ports:
      - "8080:8080"
    # No container-level healthcheck: the distroless runtime has no shell or
    # curl. Production orchestrators (k8s, Nomad) should poll GET /healthz and
    # GET /readyz over HTTP — see `internal/handler/health`.

volumes:
  torque_pg_data:
    driver: local
