server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — client-side router owns routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed assets; never cache index.html.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|gif|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Security headers that don't rely on per-request nonce generation.
  # CSP nonce-based + HSTS are applied by the upstream edge (Hostinger/
  # EasyPanel reverse proxy) since nonces must be generated per request.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Compression — nginx-unprivileged has gzip built-in.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             application/wasm image/svg+xml;
  gzip_min_length 1024;
}
